<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Canvas → MP4 (Строго 60 FPS)</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #13131d;
    --border: #252538;
    --accent: #9333ea;
    --accent-hover: #a855f7;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --success: #10b981;
    --error: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge-60fps {
    background: linear-gradient(135deg, #9333ea, #ec4899);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .main {
    display: grid;
    grid-template-columns: 380px 1fr;
    flex: 1;
    min-height: calc(100vh - 61px);
  }
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.02);
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: rgba(147, 51, 234, 0.08);
  }
  .dropzone-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .dropzone-sub {
    font-size: 12px;
    color: var(--muted);
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  select, input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); }
  .fixed-fps-box {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.35);
    color: #34d399;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-download {
    background: var(--success);
    display: none;
    text-align: center;
    text-decoration: none;
  }
  .btn-download:hover { background: #059669; }
  .progress-wrap {
    background: var(--bg);
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #9333ea, #ec4899);
    transition: width 0.08s linear;
  }
  .log {
    background: #07070b;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    color: #cbd5e1;
    flex: 1;
    min-height: 150px;
    max-height: 260px;
    overflow-y: auto;
    line-height: 1.45;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 16px;
    position: relative;
  }
  .preview-frame {
    width: 340px;
    height: 604px;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid var(--border);
    background: #000;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .status-pill {
    font-size: 13px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
  }
  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>HTML Canvas → MP4 Компилятор <span class="badge-60fps">STRICT 60 FPS</span></h1>
  <div style="font-size: 12px; color: var(--muted);">Детерминированный покадровый рендер (шаг 16.666 мс)</div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="dropzone" id="dropzone">
      <div class="dropzone-title">Перетащите .html файл сюда</div>
      <div class="dropzone-sub">или нажмите для выбора (например, tiktok_lean_animation.html)</div>
      <input type="file" id="fileInput" accept=".html,.htm" hidden>
    </div>

    <div class="control-group">
      <label>Частота кадров</label>
      <div class="fixed-fps-box">
        <span>Строго 60 FPS (без пропусков)</span>
        <span>60.00 Гц</span>
      </div>
    </div>

    <div class="control-group">
      <label>Разрешение видео</label>
      <select id="resSelect">
        <option value="source" selected>Исходное из Canvas (1080×1920)</option>
        <option value="1080x1920">1080 × 1920 (Full HD 9:16)</option>
        <option value="720x1280">720 × 1280 (HD 9:16)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Битрейт H.264</label>
      <select id="bitrateSelect">
        <option value="12000000" selected>12 Мбит/с (Высокое качество TikTok)</option>
        <option value="8000000">8 Мбит/с (Стандарт)</option>
        <option value="18000000">18 Мбит/с (Максимальное)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Длительность (сек)</label>
      <input type="number" id="durationInput" step="0.1" min="0.5" max="120" value="13.5">
    </div>

    <button class="btn" id="compileBtn" disabled>Скомпилировать строго в 60 FPS MP4</button>
    <a class="btn btn-download" id="downloadBtn" download="tiktok_animation_60fps.mp4">Скачать готовый MP4 (60 FPS)</a>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="log" id="logBox"></div>
  </div>

  <div class="stage">
    <div class="preview-frame">
      <iframe id="stageFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div class="status-pill" id="statusPill">Ожидание HTML-файла...</div>
  </div>
</div>

<script type="module">
import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm';

const STRICT_FPS = 60;
const FRAME_STEP_MS = 1000 / STRICT_FPS; // 16.666666... мс на каждый кадр

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const resSelect = document.getElementById('resSelect');
const bitrateSelect = document.getElementById('bitrateSelect');
const durationInput = document.getElementById('durationInput');
const compileBtn = document.getElementById('compileBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const statusPill = document.getElementById('statusPill');
const logBox = document.getElementById('logBox');
const stageFrame = document.getElementById('stageFrame');

let rawHtml = '';
let loadedFileName = 'animation';
let isCompiling = false;

function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
  const color = type === 'err' ? '#f87171' : type === 'ok' ? '#34d399' : '#cbd5e1';
  logBox.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
  logBox.scrollTop = logBox.scrollHeight;
}

log('Инициализирован детерминированный 60 FPS рендерер (шаг 16.67 мс).');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

async function handleFile(file) {
  loadedFileName = file.name.replace(/\.[^/.]+$/, '');
  rawHtml = await file.text();
  downloadBtn.style.display = 'none';
  progressBar.style.width = '0%';
  log(`Загружен файл: ${file.name} (${(file.size / 1024).toFixed(1)} КБ)`);

  const durMatch = rawHtml.match(/DURATION\s*=\s*([0-9]+(?:\.[0-9]+)?)/);
  if (durMatch) {
    durationInput.value = parseFloat(durMatch[1]);
    log(`Автоопределена длительность сцены: ${durationInput.value} сек (${Math.round(durationInput.value * STRICT_FPS)} кадров при 60 FPS).`);
  }

  await mountStage(false);
}

function buildInjectedHtml(html, lockClock) {
  const hookScript = `
<script>
(function() {
  window.__capturedCanvases = [];
  window.__rafCallbacks = [];
  window.__virtualTime = 0;
  window.__lockClock = ${lockClock ? 'true' : 'false'};
  window.__audioChunks = [];
  window.__audioSampleRate = 48000;

  // Виртуальные часы для 100% детерминированного 60 FPS без пропуска кадров
  const origPerfNow = performance.now.bind(performance);
  const origDateNow = Date.now.bind(Date);
  performance.now = function() {
    return window.__lockClock ? window.__virtualTime : origPerfNow();
  };
  Date.now = function() {
    return window.__lockClock ? Math.floor(window.__virtualTime) : origDateNow();
  };

  const origRAF = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function(cb) {
    if (window.__lockClock) {
      window.__rafCallbacks.push(cb);
      return window.__rafCallbacks.length;
    }
    return origRAF(cb);
  };

  window.__stepFrame60FPS = function(dtMs) {
    window.__virtualTime += dtMs;
    const cbs = window.__rafCallbacks.splice(0, window.__rafCallbacks.length);
    for (let i = 0; i < cbs.length; i++) {
      try { cbs[i](window.__virtualTime); } catch (e) { console.error(e); }
    }
  };

  // Перехват getContext для точного захвата Canvas
  const origGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function(type, attrs) {
    if (type === 'webgl' || type === 'webgl2') {
      attrs = Object.assign({}, attrs, { preserveDrawingBuffer: true });
    }
    const ctx = origGetContext.call(this, type, attrs);
    if (ctx && !window.__capturedCanvases.includes(this)) {
      window.__capturedCanvases.push(this);
    }
    return ctx;
  };

  // Перехват Web Audio API для записи звука
  const OrigAudioCtx = window.AudioContext || window.webkitAudioContext;
  if (OrigAudioCtx) {
    window.AudioContext = window.webkitAudioContext = function(...args) {
      const ac = new OrigAudioCtx(...args);
      window.__audioSampleRate = ac.sampleRate;
      const recorder = ac.createScriptProcessor(4096, 2, 2);
      recorder.onaudioprocess = function(e) {
        if (!window.__lockClock) return;
        const l = new Float32Array(e.inputBuffer.getChannelData(0));
        const r = e.inputBuffer.numberOfChannels > 1
          ? new Float32Array(e.inputBuffer.getChannelData(1))
          : new Float32Array(l);
        window.__audioChunks.push({ l, r });
      };
      const origConnect = AudioNode.prototype.connect;
      AudioNode.prototype.connect = function(dest, ...rest) {
        if (dest === ac.destination) {
          try { origConnect.call(this, recorder); } catch(_) {}
        }
        return origConnect.call(this, dest, ...rest);
      };
      recorder.connect(ac.destination);
      return ac;
    };
  }

  window.addEventListener('DOMContentLoaded', () => {
    const style = document.createElement('style');
    style.textContent = \`
      html, body {
        margin: 0 !important; padding: 0 !important;
        width: 100% !important; height: 100% !important;
        overflow: hidden !important; background: #000 !important;
        display: flex !important; align-items: center !important; justify-content: center !important;
      }
      canvas {
        max-width: 100% !important; max-height: 100% !important;
        width: auto !important; height: auto !important;
        object-fit: contain !important;
      }
      #renderBtn, button { display: none !important; }
    \`;
    document.head.appendChild(style);
  });
})();
<\/script>`;

  if (/<head[^>]*>/i.test(html)) {
    return html.replace(/<head[^>]*>/i, match => match + hookScript);
  }
  return hookScript + html;
}

function mountStage(lockClock) {
  return new Promise((resolve, reject) => {
    stageFrame.onload = () => {
      setTimeout(() => {
        try {
          const doc = stageFrame.contentDocument;
          const win = stageFrame.contentWindow;
          const canvas = doc.getElementById('scene')
            || (win.__capturedCanvases && win.__capturedCanvases[0])
            || doc.querySelector('canvas');

          if (!canvas || canvas.width === 0 || canvas.height === 0) {
            reject(new Error('Не найден активный <canvas> с ненулевыми размерами.'));
            return;
          }

          if (!lockClock) {
            log(`Canvas захвачен: ${canvas.width}×${canvas.height} px. Готов к рендеру в 60 FPS.`, 'ok');
            statusPill.textContent = `Canvas ${canvas.width}×${canvas.height} • Готов к 60 FPS`;
            compileBtn.disabled = false;
          }
          resolve({ doc, win, canvas });
        } catch (err) {
          reject(err);
        }
      }, 150);
    };
    stageFrame.srcdoc = buildInjectedHtml(rawHtml, lockClock);
  });
}

compileBtn.addEventListener('click', async () => {
  if (isCompiling || !rawHtml) return;
  isCompiling = true;
  compileBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.width = '0%';

  try {
    const durationSec = Math.max(0.5, parseFloat(durationInput.value) || 13.5);
    const totalFrames = Math.round(durationSec * STRICT_FPS);
    const bitrate = parseInt(bitrateSelect.value, 10);

    log(`Запуск детерминированного 60 FPS рендера: ${totalFrames} кадров (${durationSec} сек)...`);
    statusPill.textContent = 'Инициализация 60 FPS сцены...';

    const { win, canvas } = await mountStage(true);

    let outW = canvas.width;
    let outH = canvas.height;
    if (resSelect.value !== 'source') {
      const [w, h] = resSelect.value.split('x').map(Number);
      outW = w;
      outH = h;
    }
    outW = outW % 2 === 0 ? outW : outW + 1;
    outH = outH % 2 === 0 ? outH : outH + 1;

    const bufferCanvas = document.createElement('canvas');
    bufferCanvas.width = outW;
    bufferCanvas.height = outH;
    const bCtx = bufferCanvas.getContext('2d', { alpha: false });

    const muxer = new Muxer({
      target: new ArrayBufferTarget(),
      video: {
        codec: 'avc',
        width: outW,
        height: outH,
        frameRate: STRICT_FPS
      },
      firstTimestampBehavior: 'offset',
      fastStart: 'in-memory'
    });

    let encoderError = null;
    const videoEncoder = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: e => { encoderError = e; }
    });

    videoEncoder.configure({
      codec: 'avc1.640028',
      width: outW,
      height: outH,
      bitrate: bitrate,
      framerate: STRICT_FPS,
      latencyMode: 'quality'
    });

    log(`Кодек H.264 настроен: ${outW}×${outH}, строго ${STRICT_FPS} FPS, ${(bitrate / 1e6).toFixed(0)} Мбит/с.`);

    for (let frameIdx = 0; frameIdx < totalFrames; frameIdx++) {
      if (encoderError) throw encoderError;

      // Сдвигаем виртуальное время строго на 1000/60 мс за кадр
      win.__stepFrame60FPS(FRAME_STEP_MS);

      bCtx.fillStyle = '#000';
      bCtx.fillRect(0, 0, outW, outH);
      bCtx.drawImage(canvas, 0, 0, outW, outH);

      // Строгое микросекундное время каждого кадра (кратное 16666.67 мкс)
      const timestampUs = Math.round((frameIdx * 1_000_000) / STRICT_FPS);
      const durationUs = Math.round(1_000_000 / STRICT_FPS);

      const frame = new VideoFrame(bufferCanvas, {
        timestamp: timestampUs,
        duration: durationUs
      });

      const isKeyFrame = frameIdx % STRICT_FPS === 0; // Keyframe ровно раз в 1 секунду (каждые 60 кадров)
      videoEncoder.encode(frame, { keyFrame: isKeyFrame });
      frame.close();

      if (videoEncoder.encodeQueueSize > 8) {
        await new Promise(r => setTimeout(r, 4));
      }

      if (frameIdx % 6 === 0 || frameIdx === totalFrames - 1) {
        const pct = ((frameIdx + 1) / totalFrames) * 100;
        progressBar.style.width = `${pct.toFixed(1)}%`;
        statusPill.textContent = `Рендер 60 FPS: кадр ${frameIdx + 1} / ${totalFrames} (${pct.toFixed(0)}%)`;
        await new Promise(r => setTimeout(r, 0));
      }
    }

    statusPill.textContent = 'Финализация MP4 контейнера...';
    await videoEncoder.flush();
    videoEncoder.close();
    muxer.finalize();

    const { buffer } = muxer.target;
    const blob = new Blob([buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);

    downloadBtn.href = url;
    downloadBtn.download = `${loadedFileName}_60fps.mp4`;
    downloadBtn.style.display = 'block';

    const sizeMb = (blob.size / (1024 * 1024)).toFixed(2);
    log(`Готово! Видео скомпилировано строго в 60.00 FPS (${totalFrames} кадров, ${sizeMb} МБ).`, 'ok');
    statusPill.textContent = `Готово • ${outW}×${outH} • 60.00 FPS • ${sizeMb} МБ`;

    // Возвращаем живое превью в обычный режим
    await mountStage(false);
  } catch (err) {
    console.error(err);
    log(`Ошибка компиляции: ${err.message || err}`, 'err');
    statusPill.textContent = 'Ошибка при компиляции';
  } finally {
    isCompiling = false;
    compileBtn.disabled = false;
  }
});
</script>
</body>
</html>
